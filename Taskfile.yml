# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  GREETING: Hello, world!
  BACKEND_DIR: packages/backend
  BIN_DIR: bin
  BIN_NAME: backend
  FRONTEND_DIR: packages/frontend

tasks:
  default:
    desc: Print a greeting message
    cmds:
      - echo "{{.GREETING}}"
    silent: true

  backend:dev:
    desc: Run the backend locally (APP_ENV=local)
    dir: '{{.BACKEND_DIR}}'
    env:
      APP_ENV: local
    cmds:
      - go run ./cmd

  backend:build:
    desc: Build the backend binary
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - mkdir -p ../../{{.BIN_DIR}}
      - go build -o ../../{{.BIN_DIR}}/{{.BIN_NAME}} ./cmd

  frontend:dev:
    desc: Run the frontend dev server
    dir: '{{.FRONTEND_DIR}}'
    cmds:
      - pnpm dev

  frontend:build:
    desc: Build the frontend for production
    dir: '{{.FRONTEND_DIR}}'
    cmds:
      - pnpm build

  dev:
    desc: Run backend and frontend dev servers concurrently
    deps:
      - backend:dev
      - frontend:dev

  build:
    desc: Build backend and frontend
    deps:
      - backend:build
      - frontend:build
