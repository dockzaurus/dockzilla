# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  BACKEND_DIR: packages/backend
  BIN_DIR: bin
  BIN_NAME: backend
  FRONTEND_DIR: packages/frontend

tasks:
  backend:dev:
    desc: Run the backend locally (APP_ENV=local)
    dir: '{{.BACKEND_DIR}}'
    env:
      APP_ENV: local
    cmds:
      - go run ./cmd

  backend:build:
    desc: Build the backend binary
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - mkdir -p ../../{{.BIN_DIR}}
      - go build -o ../../{{.BIN_DIR}}/{{.BIN_NAME}} ./cmd

  backend:lint:
    desc: Lint the backend (golangci-lint, Uber style rules)
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - golangci-lint run

  backend:lint:fix:
    desc: Lint the backend and apply the auto-fixable subset
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - golangci-lint run --fix

  backend:test:
    desc: Run the backend tests with the race detector
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - go test -race ./...

  backend:test:integration:
    desc: Run the backend tests against a real Postgres, defaulting to the local dev database
    dir: '{{.BACKEND_DIR}}'
    env:
      DOCKZILLA_TEST_DATABASE_URL: '{{.DOCKZILLA_TEST_DATABASE_URL | default "postgres://dev@dockzilla:dev_password_123@localhost:5432/dockzilla-database-dev?sslmode=disable"}}'
    cmds:
      - go test -race ./...

  backend:check:
    desc: Everything CI runs for the backend — build, vet, lint, test
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - ./scripts/vendor-pgque.sh --verify
      - go build ./...
      - go vet ./...
      - go run ./cmd/schemagen -check
      - golangci-lint run
      - go test -race ./...

  backend:schemas:gen:
    desc: Regenerate the committed job payload schemas from the pkg/domain argument structs
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - go run ./cmd/schemagen

  backend:schemas:check:
    desc: Fail when a committed job payload schema no longer matches its argument struct
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - go run ./cmd/schemagen -check

  backend:pgque:vendor:
    desc: 'Re-fetch the vendored PgQue schema; pass a tag to upgrade the pin: task backend:pgque:vendor -- v0.3.0'
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - ./scripts/vendor-pgque.sh {{.CLI_ARGS}}

  backend:pgque:verify:
    desc: Check the vendored PgQue schema against its pinned checksum
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - ./scripts/vendor-pgque.sh --verify

  backend:pgque:install:
    desc: Apply the vendored PgQue schema to DATABASE_URL, then assert the installed version
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - ./scripts/vendor-pgque.sh --install

  frontend:dev:
    desc: Run the frontend dev server
    dir: '{{.FRONTEND_DIR}}'
    cmds:
      - pnpm dev

  frontend:build:
    desc: Build the frontend for production
    dir: '{{.FRONTEND_DIR}}'
    cmds:
      - pnpm build

  dev:
    desc: Run backend and frontend dev servers concurrently
    deps:
      - backend:dev
      - frontend:dev

  build:
    desc: Build backend and frontend
    deps:
      - backend:build
      - frontend:build
