[service]
name = "dockzilla-back"
version = "v1"

[storage]
  [storage.database]
    url = ""
  [storage.cache]
    url = ""

[http]
service_name = "dockzilla-http-api"
service_version = "v1"

[http.http_server]
port = 8080
read_timeout = "10s"
write_timeout = "10s"

[http.telemetry]
enabled = true
endpoint = "http://localhost:4317"
insecure = true
