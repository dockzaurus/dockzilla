name: Backend CI

on:
  pull_request:
    paths:
      - "packages/backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [master]
    paths:
      - "packages/backend/**"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/backend

jobs:
  build:
    name: Build | Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/backend/go.mod
          cache-dependency-path: packages/backend/go.sum

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: packages/backend

      - name: Compile
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Verify go.mod and go.sum are tidy
        run: go mod tidy -diff

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The jobs queue tests assert that a rolled-back transaction leaves no job
    # behind. A fake queue rolls back a write it never made, so that property
    # only means something against a real Postgres — without this service the
    # tests skip and the guarantee goes unchecked.
    #
    # pg_cron is deliberately absent: PgQue only requires it for pgque.start(),
    # which schedules the ticker, and nothing here consumes.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: dockzilla-test
          POSTGRES_USER: dockzilla
          POSTGRES_PASSWORD: dockzilla
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DOCKZILLA_TEST_DATABASE_URL: postgres://dockzilla:dockzilla@localhost:5432/dockzilla-test?sslmode=disable

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/backend/go.mod
          cache-dependency-path: packages/backend/go.sum

      - name: Install the PgQue schema
        env:
          DATABASE_URL: ${{ env.DOCKZILLA_TEST_DATABASE_URL }}
        run: ./scripts/vendor-pgque.sh --install

      - name: Test
        run: go test -race ./...
